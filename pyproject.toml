[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shotforge"
version = "0.4.0"
description = "App Store and Google Play image generator CLI + MCP server: asks first, then Claude decides colours, 2D/3D template and copy; separate store-ready images per page and language, plus a zip."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["app store", "screenshots", "aso", "claude", "mcp", "mockup", "app preview"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = ["pillow>=10", "numpy"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
api = ["anthropic"]
openai = ["openai>=1.66"]
dev = ["pytest", "mcp>=1.2"]

[project.urls]
Homepage = "https://github.com/ibrahimatmaca/shotforge"
Issues = "https://github.com/ibrahimatmaca/shotforge/issues"

[project.scripts]
shotforge = "shotforge.cli:main"
shotforge-mcp = "shotforge.mcp_server:main"

[tool.setuptools]
packages = ["shotforge"]

[tool.setuptools.package-data]
shotforge = ["templates/*.json", "fonts/*", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
